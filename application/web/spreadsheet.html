<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Excel 工作簿编辑器</title>
  <link rel="stylesheet" href="css/spreadsheet.css">
</head>
<body>
  <header class="toolbar">
    <div class="title-block"><strong id="file-name">Excel 工作簿</strong><span id="focus-note">正在读取工作簿…</span></div>
    <div class="tools">
      <label for="sheet-select">工作表</label>
      <select id="sheet-select" disabled></select>
      <a id="original-link" hidden>下载原文件</a>
      <button id="save-button" type="button" disabled>下载修改后的 Excel</button>
    </div>
  </header>
  <main class="sheet-wrap" id="sheet-wrap" aria-label="可编辑工作表"></main>
  <footer id="status" role="status">正在读取工作簿…</footer>
  <script type="module" src="js/spreadsheet.js"></script>
</body>
</html>
